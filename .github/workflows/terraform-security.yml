name: Terraform Security AI Review

on:
  pull_request:
    paths:
      - '**.tf'
  workflow_dispatch: # ✅ manual trigger

jobs:
  terraform-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      # Run Checkov (soft-fail, JSON output)
      - name: Run Checkov
        run: |
          mkdir -p reports
          checkov -d . -o json -s --output-file-path reports/checkov.json

      # ✅ Run tfsec using official GitHub Action
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          args: --format json --out reports/tfsec.json --soft-fail

      # Merge reports into one JSON
      - name: Merge Reports
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          jq -n \
            --slurpfile checkov reports/checkov.json \
            --slurpfile tfsec reports/tfsec.json \
            '{checkov: $checkov[0], tfsec: $tfsec[0]}' > combined_report.json

      # AI Security Review
      - name: Run AI Security Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python .github/scripts/ai_review.py combined_report.json > ai_review.md

      # Comment on PR if triggered by PR
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: ai_review.md

      # Upload artifact if triggered manually
      - name: Upload AI Review Report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-report
          path: ai_review.md
          retention-days: 7
