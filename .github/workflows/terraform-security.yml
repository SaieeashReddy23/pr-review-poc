name: Terraform Security AI Review

on:
  pull_request:
    paths:
      - '**.tf'
  workflow_dispatch: # manual trigger

jobs:
  terraform-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          mkdir -p reports
          checkov -d . -o json --output-file-path reports/report.json --quiet || true
          # Ensure report file exists
          [ -s reports/report.json ] || echo '{}' > reports/report.json

      - name: Run AI Security Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python .github/scripts/ai_review.py reports/report.json > ai_review.md
          cat ai_review.md   # 👀 show summary in logs

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: ai_review.md

      - name: Upload AI Review Report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-report
          path: ai_review.md
          retention-days: 7
